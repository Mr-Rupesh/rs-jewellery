# Firebase App Hosting configuration for the live site.
# Before every deploy run:  npm run check:deploy
# Replace every REPLACE_WITH_... value. Secrets are NOT written here: they live in Google Secret Manager (see DEPLOYMENT.md).

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0 # 0 = no cost while idle, but the first visit after a quiet spell is slower. Use 1 to keep one copy warm (costs more).
  maxInstances: 3 # caps the cost. The rate limiter works per copy of the server, so keep this small.
  concurrency: 80

env:
  # ---- Switches (must stay as they are in production) ----
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ENABLE_PHONE_LOGIN
    value: "false"
    availability:
      - BUILD
      - RUNTIME

  # ---- Firebase web app settings: Firebase console > Project settings > Your apps > Web app > Config (these are public values) ----
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBEDYwiCCZ96H38ipgotVrKsaxZOrWveLo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: rs-jewellers-efcfe.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: rs-jewellers-efcfe
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: https://console.firebase.google.com/u/2/project/rs-jewellers-efcfe/storage/rs-jewellers-efcfe.firebasestorage.app/file
    availability:
      - BUILD
      - RUNTIME

  # ---- Shop details (shown on the site, invoices and policy pages). GSTIN is left out until you have one: empty values are not allowed here. ----
  - variable: NEXT_PUBLIC_SHOP_NAME
    value: R S Jewellers
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SHOP_ADDRESS
    value: 12/16A, Old Hanuman Gali, 1st Cross Lane, 2nd Floor, Room No. 19,
      Kalbadevi Road, Mumbai 400002
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SHOP_STATE
